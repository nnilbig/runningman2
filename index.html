<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>跑者阿傑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&display=swap">
<style>
/* Layout: full-bleed cinematic stage; landscape = 2.39:1 band between black bars, portrait = full 9:16 frame */
:root{
  --ink:#0b0b0c;          /* letterbox + fades */
  --paper:#ece4d6;        /* subtitle text, washi white */
  --paper-dim:#a79e90;    /* secondary text */
  --rust:#b5643c;         /* single accent: rust of old shutters */
  --line:rgba(236,228,214,.28);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden}
body{font-family:var(--sans)}
#stage{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center}
#band{position:relative;overflow:hidden;background:#20242a}
#band canvas{display:block;width:100%;height:100%;filter:saturate(.78) contrast(1.06) sepia(.1)}
.fx{position:absolute;inset:0;pointer-events:none}
#vignette{background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(8,8,10,.62) 100%)}
#grain{opacity:.13;mix-blend-mode:overlay;background-size:180px 180px}
#fade{background:var(--ink);opacity:1;transition:opacity 1.6s ease}
#sub{position:fixed;left:0;right:0;text-align:center;font-family:var(--serif);font-weight:300;
  font-size:clamp(15px,2.3vw,21px);letter-spacing:.12em;line-height:1.7;color:var(--paper);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  text-shadow:0 1px 8px rgba(0,0,0,.7);pointer-events:none;text-wrap:balance}
#sub span{opacity:0;transition:opacity .5s ease}
#sub span.on{opacity:1}
#sub.out span{opacity:0;transition:opacity 1.2s ease}
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--serif);font-weight:400;font-size:clamp(14px,1.8vw,18px);letter-spacing:.4em;color:var(--paper);
  opacity:0;transition:opacity 1.4s ease}
#card.on{opacity:1}
#choices{position:fixed;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;transition:opacity .9s ease;pointer-events:none}
#choices.on{opacity:1;pointer-events:auto}
.opts{display:flex;gap:clamp(16px,6vw,72px);flex-wrap:wrap;justify-content:center}
.opt{font-family:var(--serif);font-size:clamp(15px,2vw,19px);letter-spacing:.3em;color:var(--paper);
  background:rgba(11,11,12,.35);border:1px solid var(--line);padding:12px 22px 12px 28px;cursor:pointer;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:border-color .3s,background .3s}
.opt:hover,.opt:focus-visible{border-color:var(--paper);background:rgba(11,11,12,.55);outline:none}
.opt:focus-visible{box-shadow:0 0 0 2px var(--rust)}
#timer{width:min(240px,50vw);height:1px;background:var(--line);overflow:hidden}
#timer i{display:block;height:100%;width:100%;background:var(--paper);transform-origin:left}

/* title screen */
#title{position:fixed;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:radial-gradient(ellipse at 60% 40%,#1d1f23 0%,var(--ink) 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity 1.2s ease}
#title.gone{opacity:0;pointer-events:none}
.tname{grid-column:2;writing-mode:vertical-rl;font-family:var(--serif);font-weight:600;
  font-size:clamp(40px,8vh,76px);letter-spacing:.35em;color:var(--paper);line-height:1}
.tmeta{grid-column:3;justify-self:start;display:flex;flex-direction:column;gap:22px;padding-left:clamp(20px,5vw,64px)}
.tch{writing-mode:vertical-rl;font-family:var(--serif);font-size:15px;letter-spacing:.4em;color:var(--paper-dim);
  border-right:1px solid var(--rust);padding-right:10px;height:max-content}
.tleft{grid-column:1;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:14px;padding-right:clamp(20px,5vw,64px)}
#start{font-family:var(--serif);font-size:16px;letter-spacing:.35em;color:var(--ink);background:var(--paper);
  border:0;padding:13px 22px 13px 28px;cursor:pointer}
#start:focus-visible{outline:2px solid var(--rust);outline-offset:3px}
.note{font-size:12px;letter-spacing:.12em;color:var(--paper-dim);text-align:right;line-height:1.8}
.toggles{display:flex;gap:16px;font-size:12px;letter-spacing:.1em;color:var(--paper-dim)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--rust)}
@media (max-aspect-ratio:1/1){
  #title{grid-template-columns:1fr;grid-template-rows:1fr auto;justify-items:center;padding-block:48px}
  .tname{grid-column:1;grid-row:1;align-self:center}
  .tmeta{display:none}
  .tleft{grid-column:1;grid-row:2;align-items:center;padding-right:0}
  .note{text-align:center}
}
#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  font-family:var(--serif);background:var(--ink);opacity:0;pointer-events:none;transition:opacity 1.6s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#end.on{opacity:1;pointer-events:auto}
#end .e1{font-size:clamp(18px,2.6vw,24px);letter-spacing:.45em;color:var(--paper)}
#end .e2{font-size:14px;letter-spacing:.25em;color:var(--paper-dim)}
#end .e2 b{font-weight:400;color:var(--rust)}
#again{font-family:var(--serif);font-size:14px;letter-spacing:.3em;color:var(--paper);background:transparent;
  border:1px solid var(--line);padding:10px 18px 10px 24px;cursor:pointer}
#again:hover,#again:focus-visible,#next:hover,#next:focus-visible{border-color:var(--paper);outline:none}
.ebtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#next{font-family:var(--serif);font-size:14px;letter-spacing:.3em;color:var(--ink);background:var(--paper);border:1px solid var(--paper);padding:10px 18px 10px 24px;cursor:pointer}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5}
#skip,#mute{
  font-size:12px;letter-spacing:.15em;color:var(--paper-dim);background:transparent;border:1px solid var(--line);
  padding:6px 10px;cursor:pointer;opacity:.6}
#mute:hover,#mute:focus-visible,#skip:hover,#skip:focus-visible{opacity:1;outline:none}
</style>

</head>
<body>
<div id="stage"><div id="band"><div class="fx" id="vignette"></div><div class="fx" id="grain"></div><div class="fx" id="fade"></div></div></div>
<div id="sub" aria-live="polite"></div>
<div id="card"></div>
<div id="choices"><div class="opts"><button class="opt" id="optA">出門</button><button class="opt" id="optB">不出門</button></div><div id="timer"><i></i></div></div>

<div id="title">
  <div class="tleft">
    <button id="start">開始觀看</button>
    <div class="toggles">
      <label><input type="checkbox" id="optSound" checked>聲音</label>
      <label><input type="checkbox" id="optCalm">減少晃動</label>
    </div>
  </div>
  <div class="tname" id="tname">第一章　起跑</div>
</div>

<div id="end"><div class="e1" id="endTitle">第一章　起跑　完</div><div class="e2" id="endNext"></div><div class="ebtns"><button id="again">重看第一章</button><button id="next" hidden>繼續第二章</button></div></div>
<div id="hud" hidden><button id="skip">下一章 ›</button><button id="mute">聲音 開</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('optCalm').checked=calm;

/* ---------- grain ---------- */
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const d=g.createImageData(180,180);
for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
g.putImageData(d,0,0);$('grain').style.backgroundImage=`url(${c.toDataURL()})`;})();
let grainT=0;

/* ---------- renderer ---------- */
const band=$('band');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.outputEncoding=THREE.sRGBEncoding;
band.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,.1,400);
let portrait=false;

function layout(){
  const W=innerWidth,H=innerHeight;portrait=W/H<1;
  let bw=W,bh=H;
  if(!portrait&&W/H<2.39){bh=Math.round(W/2.39);}
  band.style.width=bw+'px';band.style.height=bh+'px';
  renderer.setSize(bw,bh,false);
  camera.aspect=bw/bh;camera.fov=portrait?62:34;camera.updateProjectionMatrix();
  const bar=(H-bh)/2;const sub=$('sub'),ch=$('choices');
  if(!portrait&&bar>=64){sub.style.top='auto';sub.style.bottom=(bar/2-16)+'px';ch.style.bottom=(bar+18)+'px';}
  else{sub.style.top='auto';sub.style.bottom=(portrait?H*0.2:bar+H*0.06)+'px';ch.style.bottom=(portrait?H*0.06:bar+H*0.2)+'px';}
}
addEventListener('resize',layout);

/* ---------- sky + fog ---------- */
const skyC=document.createElement('canvas');skyC.width=2;skyC.height=256;
const skyTex=new THREE.CanvasTexture(skyC);skyTex.encoding=THREE.sRGBEncoding;scene.background=skyTex;
scene.fog=new THREE.Fog(0x8a8f99,16,125);
const PAL={winter:[{top:[44,52,64],mid:[110,116,126],hor:[178,166,156]},{top:[84,96,112],mid:[164,158,154],hor:[236,196,160]}],
  afternoon:[{top:[98,118,142],mid:[192,184,166],hor:[236,210,168]},{top:[88,92,116],mid:[206,170,132],hor:[246,180,118]}],
  spring:[{top:[92,112,138],mid:[170,174,178],hor:[226,208,190]},{top:[104,134,168],mid:[188,194,198],hor:[242,228,208]}]};
let dawnA=PAL.winter[0],dawnB=PAL.winter[1];
function usePalette(k){dawnA=PAL[k][0];dawnB=PAL[k][1];dawn=-1}
let dawn=-1,baseExpo=1,expoMul=1,rimMul=1;
function mix(a,b,t){return a.map((v,i)=>Math.round(lerp(v,b[i],t)))}
function setDawn(t){
  if(Math.abs(t-dawn)<.004)return;dawn=t;
  const g=skyC.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  const top=mix(dawnA.top,dawnB.top,t),mid=mix(dawnA.mid,dawnB.mid,t),hor=mix(dawnA.hor,dawnB.hor,t);
  gr.addColorStop(0,`rgb(${top})`);gr.addColorStop(.55,`rgb(${mid})`);gr.addColorStop(1,`rgb(${hor})`);
  g.fillStyle=gr;g.fillRect(0,0,2,256);skyTex.needsUpdate=true;
  const f=mix(mix(dawnA.mid,dawnA.hor,.5),mix(dawnB.mid,dawnB.hor,.5),t);
  scene.fog.color.setRGB(f[0]/255,f[1]/255,f[2]/255).convertSRGBToLinear();
  sun.intensity=lerp(.95,1.7,t)*sunMul;sun.color.setHSL(lerp(.07,.08,t),lerp(.35,.7,t),lerp(.62,.68,t));
  hemi.intensity=lerp(.42,.62,t);
  baseExpo=lerp(.82,1.05,t);
  rimU.forEach(u=>u.rimStr.value=lerp(.35,1.2,t)*rimMul);haloStr=lerp(.18,.55,t);signGlow=lerp(1,.18,t);
  litSigns.forEach(m=>m.emissiveIntensity=.85*signGlow);reflections.forEach(r=>r.material.opacity=.32*signGlow);
}

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xaab4c8,0x4a3e34,.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc49a,1);sun.castShadow=true;
const SM=renderer.capabilities.maxTextureSize>=4096?4096:2048;
sun.shadow.mapSize.set(SM,SM);const sc=sun.shadow.camera;sc.left=-34;sc.right=34;sc.top=34;sc.bottom=-34;sc.near=1;sc.far=140;
sun.shadow.bias=-.0005;scene.add(sun);scene.add(sun.target);
const sunOff=new THREE.Vector3(5,7.5,-42);
sc.left=-24;sc.right=24;sc.top=34;sc.bottom=-34;sc.near=1;sc.far=480;sc.updateProjectionMatrix();
function placeSun(off){sun.target.position.set(0,0,-120);sun.position.copy(sun.target.position).addScaledVector(off.clone().normalize(),230)}
placeSun(sunOff);
const sunSpring=new THREE.Vector3(9,15,-40),sunAfternoon=new THREE.Vector3(-6,8,42);

/* ---------- textures ---------- */
function tex(c,rx=1,ry=1){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function speckle(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,250,240'},${Math.random()*a})`;g.fillRect(Math.random()*w,Math.random()*h,rand(1,3),rand(1,3))}}
function stains(g,w,h){for(let i=0;i<6;i++){const x=Math.random()*w;const gr=g.createLinearGradient(0,h*rand(.1,.5),0,h);gr.addColorStop(0,'rgba(40,30,20,0)');gr.addColorStop(1,'rgba(40,30,20,.18)');g.fillStyle=gr;g.fillRect(x,0,rand(6,30),h)}}

/* Keelung consignment-shop (委託行) district: arcaded shophouses, Chinese signage, drizzle, harbor cranes */
const asphalt=(()=>{const[c,g]=canvas(256,256);g.fillStyle='#2f3133';g.fillRect(0,0,256,256);speckle(g,256,256,5000,.22);
  for(let i=0;i<14;i++){g.fillStyle=`rgba(20,22,24,${rand(.15,.35)})`;g.beginPath();g.ellipse(rand(20,236),rand(0,256),rand(8,30),rand(14,50),0,0,7);g.fill()}
  g.fillStyle='rgba(228,214,150,.8)';g.fillRect(14,0,5,256);g.fillRect(237,0,5,256);return tex(c,1,40)})();
const pave=(()=>{const[c,g]=canvas(128,128);g.fillStyle='#7d7a74';g.fillRect(0,0,128,128);speckle(g,128,128,1500,.2);
  g.strokeStyle='rgba(30,30,30,.3)';g.lineWidth=1.5;for(let i=0;i<=128;i+=16){g.beginPath();g.moveTo(0,i);g.lineTo(128,i);g.stroke();g.beginPath();g.moveTo(i,0);g.lineTo(i,128);g.stroke()}return tex(c,2,90)})();

const wallSets=[
  {c:'#9b9a94',tile:0},{c:'#8d908d',tile:0},{c:'#a9a59b',tile:0},
  {c:'#cfc8b8',tile:1},{c:'#d6d2c8',tile:1},{c:'#a7b6ab',tile:1},{c:'#a4b0b8',tile:1},{c:'#8a6c58',tile:2}
];
const shopNames=['美琪委託行','大新舶來品','金生鐘錶行','華美西服','新光皮鞋','長興五金行','正大西藥房','海港冰果室','永發銀樓','光華照相館','萬國洋酒','百樂精品','義興布莊','福安茶行','港都旅社'];
const vNames=['委託行','舶來品','西服','鐘錶','皮鞋','藥房','旅社','銀樓','洋酒','理髮','精品','布莊'];
const signCols=[['#a8281e','#f3ead8'],['#f1ece0','#b02a1f'],['#1f4f8a','#f1ece0'],['#e2b832','#9d1f17'],['#2f6b4a','#f1ece0'],['#f1ece0','#1f3f6e']];
const pick=a=>a[(Math.random()*a.length)|0];
const ARC=3.2,FRONT=3.3,BACK=5.6; // arcade height, upper facade line, ground facade line

function groundTex(wm,opt){
  const ppm=26,W=Math.round(wm*ppm),H=Math.round(ARC*ppm);const[c,g]=canvas(W,H);
  g.fillStyle=opt.col;g.fillRect(0,0,W,H);speckle(g,W,H,W*H/40,.12);
  if(opt.shop){const ow=Math.round(4.2*ppm),ox=(W-ow)/2;const gr=g.createLinearGradient(0,H-2.7*ppm,0,H);
    gr.addColorStop(0,'#2a1c12');gr.addColorStop(1,'#6b4426');g.fillStyle=gr;g.fillRect(ox,H-2.7*ppm,ow,2.7*ppm);
    g.fillStyle='#34302c';g.fillRect(ox-6,H-2.85*ppm,ow+12,6);}
  else if(opt.ground==='shutter'){
    const ow=W*.84,ox=W*.08;g.fillStyle=opt.rust?'#857d70':'#9a978f';g.fillRect(ox,H-2.7*ppm,ow,2.7*ppm);
    for(let y=H-2.7*ppm;y<H;y+=5){g.fillStyle='rgba(0,0,0,.22)';g.fillRect(ox,y,ow,1.4)}
    if(opt.rust){for(let i=0;i<30;i++){g.fillStyle=`rgba(140,70,30,${rand(.1,.35)})`;g.fillRect(ox+Math.random()*ow,H-rand(0,2.7*ppm),rand(2,10),rand(4,30))}}
    g.fillStyle='#34302c';g.fillRect(ox-4,H-2.85*ppm,ow+8,7);
    if(opt.tenant){const sw=ow*.26,sx=ox+ow*.6,sy=H-2.1*ppm;g.fillStyle='#f1ece0';g.fillRect(sx,sy,sw,sw*1.25);
      fakeGlyphs(g,sx+sw*.15,sy+sw*.12,sw*.7,sw*1.0,2,'#f1ece0',true)}}
  else{ // open consignment shop: lit glass with goods
    const ox=W*.08,ow=W*.84,oy=H-2.6*ppm;g.fillStyle='#e9d9b4';g.fillRect(ox,oy,ow,2.6*ppm);
    for(let i=0;i<14;i++){g.fillStyle=pick(['#7a2f2a','#2e3b55','#5b4a36','#3a3a3a','#8a6a3a','#1e1e1e']);const bw=rand(8,20);g.fillRect(ox+rand(0,ow-bw),oy+rand(10,2.6*ppm-30),bw,rand(18,40))}
    g.strokeStyle='#3a3530';g.lineWidth=4;g.strokeRect(ox,oy,ow,2.6*ppm);g.beginPath();g.moveTo(W/2,oy);g.lineTo(W/2,H);g.stroke();}
  const t=tex(c);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
function upperTex(wm,hu,opt){
  const ppm=26,W=Math.round(wm*ppm),H=Math.round(hu*ppm);const[c,g]=canvas(W,H);
  g.fillStyle=opt.col;g.fillRect(0,0,W,H);speckle(g,W,H,W*H/40,.12);
  if(opt.tile===1){g.strokeStyle='rgba(60,60,60,.12)';g.lineWidth=1;for(let y=0;y<H;y+=4){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}for(let x=0;x<W;x+=4){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}}
  if(opt.tile===2){g.strokeStyle='rgba(40,25,15,.35)';for(let y=0;y<H;y+=5){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();for(let x=(y/5%2)*7;x<W;x+=14){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+5);g.stroke()}}}
  // signboard band above arcade
  const bandH=Math.round(1.0*ppm);
  if(opt.board){const[bg,fg]=opt.boardCol;const bx=4,by=H-bandH-4,bw=W-8;
    if(opt.boardState==='bare'){g.strokeStyle='#3d3a36';g.lineWidth=4;g.strokeRect(bx,by,bw,bandH);for(let k=bx;k<bx+bw;k+=bw/5){g.beginPath();g.moveTo(k,by);g.lineTo(k,by+bandH);g.stroke()}}
    else{g.fillStyle=bg;g.fillRect(bx,by,bw,bandH);fakeGlyphs(g,bx+bandH*.3,by+bandH*.14,bw-bandH*.6,bandH*.72,opt.board,bg,false);
      weather(g,bx,by,bw,bandH,opt.boardState==='faded'?.38:.16);g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;g.strokeRect(bx,by,bw,bandH);}}
  // floors with iron window cages (鐵窗)
  const floors=Math.max(0,Math.floor((hu-1.2)/2.9));

const shutterTexC=(()=>{const[c,g]=canvas(128,128);g.fillStyle='#a19c92';g.fillRect(0,0,128,128);for(let y=0;y<128;y+=8){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,y,128,2);g.fillStyle='rgba(255,255,255,.08)';g.fillRect(0,y+3,128,1)}
  for(let i=0;i<40;i++){g.fillStyle=`rgba(140,70,30,${rand(.08,.3)})`;g.fillRect(Math.random()*128,Math.random()*128,rand(2,6),rand(6,20))}return tex(c,3,1)})();
const shutterPivot=new THREE.Group();shutterPivot.position.set(-BACK+.04,2.72,SHOP.z);world.add(shutterPivot);
const shutterMesh=new THREE.Mesh(new THREE.PlaneGeometry(4.3,2.72),new THREE.MeshStandardMaterial({map:shutterTexC,roughness:.7,metalness:.25}));
shutterMesh.rotation.y=Math.PI/2;shutterMesh.position.y=-1.36;shutterMesh.castShadow=true;shutterPivot.add(shutterMesh);
let shutterOpen=.45;
function setShutter(v){shutterOpen=clamp(v,.01,1);shutterPivot.scale.y=shutterOpen;shutterTexC.repeat.set(3,shutterOpen+.0001)}

const poleMat=new THREE.MeshStandardMaterial({color:0x77746e,roughness:.9});
const bandC=(()=>{const[c,g]=canvas(32,64);for(let i=-64;i<128;i+=16){g.fillStyle='#e0b528';g.beginPath();g.moveTo(0,i);g.lineTo(32,i+16);g.lineTo(32,i+24);g.lineTo(0,i+8);g.fill()}
  g.globalCompositeOperation='destination-over';g.fillStyle='#1d1b18';g.fillRect(0,0,32,64);return tex(c,2,1)})();
const PX=3.05,poleTops=[];
for(let z=ZMAX-6;z>ZMIN;z-=24){
  for(const s of[1,-1]){const pz=z+(s<0?11:0);if(s<0&&Math.abs(pz-SHOP.z)<4)continue;
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,10,10),poleMat);p.position.set(s*PX,5,pz);p.castShadow=true;world.add(p);
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.185,.185,1.4,12),new THREE.MeshStandardMaterial({map:bandC,roughness:.8}));b.position.set(s*PX,.9,pz);world.add(b);
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.9,10),poleMat);tr.position.set(s*(PX+.35),7.6,pz);tr.castShadow=true;world.add(tr);
    poleTops.push({s,z:pz});}
}
const wireMat=new THREE.LineBasicMaterial({color:0x1f1d1b,transparent:true,opacity:.85});
for(const s of[1,-1]){const tops=poleTops.filter(p=>p.s===s).sort((a,b)=>b.z-a.z);
  for(let k=0;k<5;k++){const pts=[];const sag=rand(.4,1.1);for(let i=0;i<tops.length-1;i++){const a=tops[i],b=tops[i+1];for(let j=0;j<=10;j++){const t=j/10;
    pts.push(new THREE.Vector3(s*PX+(k-2)*.22,9.4-k*.28-Math.sin(t*Math.PI)*sag,lerp(a.z,b.z,t)))}}
    world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),wireMat))}
  // drop wires into buildings
  tops.forEach(t=>{for(let k=0;k<2;k++){const pts=[];const zt=t.z+rand(-4,4);for(let j=0;j<=8;j++){const u=j/8;pts.push(new THREE.Vector3(s*lerp(PX,FRONT+.05,u),lerp(9,rand(5,7.5),u)-Math.sin(u*Math.PI)*.35,lerp(t.z,zt,u)))}
    world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),wireMat))}});
}

function tick(dt){T+=dt;for(let i=waits.length-1;i>=0;i--)if(T>=waits[i].at){waits[i].r();waits.splice(i,1)}
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=clamp(w.t/w.d,0,1);w.fn(ease(k),k);if(k>=1){w.r();tweens.splice(i,1)}}}

const camBias={x:0,y:0,z:0,lx:0,ly:0};const tmpV=new THREE.Vector3(),tmpL=new THREE.Vector3();
function updCam(dt,t){
  if(camMode==='follow'){
    const r=runner.position;const off=portrait?new THREE.Vector3(.0,2.7,5.4):new THREE.Vector3(.55,1.85,3.6);
    tmpV.set(r.x+off.x+camBias.x,r.y+off.y+camBias.y,r.z+off.z+camBias.z);tmpL.set(r.x*.5+camBias.lx,r.y+1.35+camBias.ly,r.z-(portrait?7:9));
    const k=1-Math.exp(-dt*2.6);camPos.lerp(tmpV,k);camLook.lerp(tmpL,k);
  } else {const k=1-Math.exp(-dt*3);camPos.lerp(free.pos,k);camLook.lerp(free.look,k)}
  const amp=calm?.15:1;const bob=Math.abs(Math.cos(stride))*.045*gaitAmp*(camMode==='follow'?1:0)*amp;
  camera.position.set(camPos.x+Math.sin(t*.37)*.03*amp,camPos.y+bob+Math.sin(t*.53)*.02*amp,camPos.z);
  camera.lookAt(camLook.x,camLook.y+bob*.5,camLook.z);
  camera.rotation.z+=Math.sin(stride)*.004*gaitAmp*amp;
  // sun + shadow follow
}

/* ---------- loop ---------- */
let last=performance.now(),started=false,haloFade=0,haloMul=1;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(started){tick(dt);
    if(runner.visible){pose(dt);runner.position.z-=runSpeed*dt;runner.position.y=slopeY(runner.position.z)}
    updPack(dt);
    updPuffs(dt);
  }
  haloFade=lerp(haloFade,runner.visible?1:0,1-Math.exp(-dt*1.2));halo.visible=haloFade>.01;
  if(runner.visible){halo.position.set(runner.position.x+.15,1.25+body.position.y,runner.position.z-.7);
    halo.material.opacity=haloMul*haloFade*haloStr*(camMode==='follow'?1:.5)*(.92+Math.sin(now/1000*1.3)*.08)}
  updCam(dt,now/1000);updRain(dt);updPetals(dt,now/1000);updLeaves(dt,now/1000);applyFx(dt);barberTex.forEach(t=>t.offset.y=(t.offset.y+dt*.35)%1);
  grainT+=dt;if(grainT>.08){grainT=0;$('grain').style.backgroundPosition=`${(Math.random()*180)|0}px ${(Math.random()*180)|0}px`}
  renderer.toneMappingExposure=baseExpo*expoMul;renderer.render(scene,camera);requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
layout();$('tname').textContent=TITLES[chapter];resetWorld(chapter);fade(.35);requestAnimationFrame(frame);
$('start').onclick=()=>{
  soundOn=$('optSound').checked;calm=$('optCalm').checked;
  if(soundOn){initAudio();rainSound();if(!rain.visible&&rainGain)rainGain.gain.value=0;}
  const m=$('mute');m.hidden=!ac;m.textContent=soundOn?'聲音 開':'聲音 關';$('hud').hidden=false;
  $('title').classList.add('gone');started=true;story();
};
$('mute').onclick=()=>{soundOn=!soundOn;if(master)master.gain.value=soundOn?.9:0;$('mute').textContent=soundOn?'聲音 開':'聲音 關'};
$('again').onclick=()=>{clearUI();story()};
})();
